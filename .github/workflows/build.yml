name: JavaScript Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/**"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 23.x
          registry-url: "https://registry.npmjs.org"

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            .yarn/cache
            **/node_modules
            **/.eslintcache
            **/yarn.lock
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/package.json') }}

      - name: Yarn install
        run: yarn

      - name: Build JS/TS
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          yarn ci

      # The specifications existed but nothing ran them: there was no test step here, and vitest could
      # not start at all because its required vite peer was absent, so every spec in this repository was
      # decorative. A specification that never runs is indistinguishable from one that passes.
      - name: Test JS/TS
        working-directory: ./Source
        run: yarn test

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    # A development kernel (MongoDB included) that the kernel-backed specifications (*.integration.spec.ts) run against.
    services:
      chronicle:
        image: cratis/chronicle:19.30.0-development
        ports:
          - 35000:35000
        # The webhook delivery specifications run an HTTP receiver in the job (on the runner host); this lets the
        # kernel reach it as host.docker.internal, the same address Docker Desktop provides locally.
        options: --add-host=host.docker.internal:host-gateway
      # A kernel that honors StartAtTail (Chronicle 19.70.0 or later) for the specification that needs it.
      chronicle-tail:
        image: cratis/chronicle:19.70.0-development
        ports:
          - 35001:35000
      # A kernel that applies child all-event mappings from the child's own All block without copying root mappings
      # into new children (Chronicle 19.78.1 or later), for the from-all-events specification that asserts it.
      chronicle-child-mappings:
        image: cratis/chronicle:19.78.1-development
        ports:
          - 35002:35000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 23.x
          registry-url: "https://registry.npmjs.org"

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            .yarn/cache
            **/node_modules
            **/.eslintcache
            **/yarn.lock
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/package.json') }}

      - name: Yarn install
        run: yarn

      - name: Wait for the kernel
        run: timeout 180 bash -c 'until curl -skf https://localhost:35000/health > /dev/null; do sleep 2; done'

      - name: Wait for the kernel that honors StartAtTail
        run: timeout 180 bash -c 'until curl -skf https://localhost:35001/health > /dev/null; do sleep 2; done'

      - name: Wait for the kernel that owns child all-event mappings
        run: timeout 180 bash -c 'until curl -skf https://localhost:35002/health > /dev/null; do sleep 2; done'

      - name: Kernel-backed specifications
        working-directory: ./Source
        env:
          CHRONICLE_INTEGRATION_CONNECTION_STRING: chronicle://chronicle-dev-client:chronicle-dev-secret@localhost:35000
        run: yarn test:integration --exclude '**/when_starting_at_the_tail.integration.spec.ts' --exclude '**/when_subscribing_with_from_all_events.integration.spec.ts'

      - name: Start-at-tail specification
        working-directory: ./Source
        env:
          CHRONICLE_INTEGRATION_CONNECTION_STRING: chronicle://chronicle-dev-client:chronicle-dev-secret@localhost:35001
        run: yarn test:integration reactors/for_Reactors/against_a_kernel/when_starting_at_the_tail

      - name: Child all-event mapping specification
        working-directory: ./Source
        env:
          CHRONICLE_INTEGRATION_CONNECTION_STRING: chronicle://chronicle-dev-client:chronicle-dev-secret@localhost:35002
        run: yarn test:integration projections/for_ProjectionDefinitionCompiler/against_a_kernel/when_subscribing_with_from_all_events
